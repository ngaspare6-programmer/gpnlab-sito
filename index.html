  const da64 = t => Uint8Array.from(atob(t), c => c.charCodeAt(0));
  document.getElementById("f").addEventListener("submit", async ev => {
    ev.preventDefault();
    const campo = document.getElementById("p"), btn = document.getElementById("b"), err = document.getElementById("e");
    const parola = campo.value.trim().toLowerCase();
    btn.disabled = true; err.textContent = "";
    try {
      const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(parola), "PBKDF2", false, ["deriveKey"]);
      const chiave = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: da64(PAGINA.sale), iterations: 250000, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
      const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: da64(PAGINA.iv) }, chiave, da64(PAGINA.dati)));
      document.open(); document.write(html); document.close();
    } catch (x) {
      err.textContent = "Parola sbagliata. Riprova."; campo.value = ""; campo.focus(); btn.disabled = false;
    }
  });
